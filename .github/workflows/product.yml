name: Product checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Product build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: clang-19
            cxx: clang++-19
            make: make
          - cc: gcc-14
            cxx: g++-14
            make: bmake
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      MAKE: ${{ matrix.make }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 libclang-rt-19-dev gcc-14 g++-14 bmake
      - name: Configure and test
        run: |
          ./configure --pedantic
          "$MAKE" -j2
          "$MAKE" test str-match fault
      - name: Compare sanitizer build
        if: matrix.cc == 'clang-19'
        run: |
          normal="$(mktemp "${RUNNER_TEMP}/knfmt-normal.XXXXXX")"
          cp knfmt "$normal"
          chmod u+x "$normal"
          make clean
          ./configure --pedantic --sanitize address
          make -j2
          make test
          sh tests/cross-build.sh "$normal" "$PWD/knfmt"
          rm -f "$normal"
